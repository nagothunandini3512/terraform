image: twentycrm/twenty:latest

# A list of env that can be set:
# https://twenty.com/developers/section/self-hosting/self-hosting-var
env:
  STORAGE_TYPE: "local"
  SIGN_IN_PREFILLED: "false"
  ACCESS_TOKEN_EXPIRES_IN: 7d
  LOGIN_TOKEN_EXPIRES_IN: 1h

secrets:
  appToken: "TueRippCNQYc190gdeAABwwxVdMfpl07uwNFjFQ0CtE="
  accessToken: "U9U0IbuNBiaUM4M7PTKqmXX3R1a/xHWGEsC7wSbJnA8="
  loginToken: "wjVNy5+MZJ4WeRSe+GjF0TcJsD0bYG158ttKjulWVPo="
  refreshToken: "HRppVAOuJtCVCd51EaJ8VIE+ybpRmDfuODjESE2x9jk="
  fileToken: "4r7zZyaY9/35pd8o3BMf6sWLlLr5dqOsFOLhk9yiY0g="


server:
  replicas: 3
  storage: 2Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "1000m"

worker:
  replicas: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "1000m"

db:
  enabled: true
  image: twentycrm/twenty-postgres:latest
  storage: 12Gi

  #adminPassword: some-random-string

  # those should be set in stone because are configured in init.sql
  database: twenty
  user: twenty
  password: twenty

  resources:
    requests:
      memory: "1024Mi"
      cpu: "1000m"

externalDb:
  enabled: false
  postgresConnectionString: "postgres://twenty:twenty@host:5432/twenty"

redis:
  image: redis:latest
  resources:
    requests:
      memory: "128Mi"
      cpu: "20m"



ingress:
  enabled: true
  class: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
